<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portico — the client operations platform for studios that care about craft. Projects, invoices, and conversations in one calm workspace." />
    <meta name="theme-color" content="#12110E" />
    <title>Portico — Client portal for studios</title>
  </head>
  <body>
    <script>
      // Sets the theme attribute before React mounts (and before first paint)
      // so there is never a flash of the light theme when dark is active —
      // store/theme.ts's init() re-derives the same value into React state.
      (function () {
        try {
          var stored = localStorage.getItem('portico-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
